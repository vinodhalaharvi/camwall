<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d10'/%3E%3Crect x='2' y='2' width='7' height='7' fill='%234cc38a'/%3E%3Crect x='10' y='2' width='4' height='7' fill='%239aa3ae'/%3E%3Crect x='2' y='10' width='12' height='4' fill='%239aa3ae'/%3E%3C/svg%3E">
<title>camwall</title>
<style>
  :root {
    --bg: #0b0d10; --tile: #14171c; --ink: #e8ebf0; --dim: #9aa3ae;
    --accent: #4cc38a; --warn: #f2b84b; --bad: #ef6b6b; --gap: 4px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wall { position: fixed; inset: 0; bottom: var(--bar, 0px); }
  .tile { position: absolute; padding: calc(var(--gap) / 2); }
  .tile .in { position: relative; width: 100%; height: 100%; background: var(--tile); overflow: hidden; border-radius: 3px; cursor: zoom-in; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .name {
    position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px);
    font-size: 12px; line-height: 1; padding: 5px 7px; border-radius: 4px;
    background: rgb(0 0 0 / .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; gap: 6px; align-items: center;
  }
  body.nonames .tile .name { display: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .live .dot { background: var(--accent); }
  .starting .dot, .stale .dot { background: var(--warn); }
  .retrying .dot { background: var(--bad); }
  .tile .msg {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 12px; font-size: 13px; color: var(--dim); background: rgb(11 13 16 / .7);
  }
  .starting .msg, .retrying .msg, .stale .msg { display: grid; }
  .tile .pin {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 6px;
    border: 0; background: rgb(0 0 0 / .55); color: var(--ink); font-size: 15px; cursor: pointer;
    opacity: 0; transition: opacity .15s;
  }
  .tile:hover .pin, .tile .pin.on, .tile .pin:focus-visible { opacity: 1; }
  .tile .pin.on { color: var(--warn); }
  @media (hover: none) { .tile .pin { opacity: .8; } }
  body.focus .tile { display: none; }
  body.focus .tile.focused { display: block; inset: 0 !important; width: auto !important; height: auto !important; }
  body.focus .tile.focused .in { cursor: zoom-out; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: #0f1216; border-top: 1px solid #1d2229; font-size: 13px; color: var(--dim);
  }
  #bar b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  #bar .sp { flex: 1; }
  #bar button {
    background: #1a1f26; color: var(--ink); border: 1px solid #262c35; border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer;
  }
  #bar button:hover { background: #222832; }
  body.kiosk #bar { display: none; }
  @media (max-width: 600px) {
    #summary, #kiosk { display: none; }
    #bar button { padding: 5px 8px; }
  }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: var(--dim); }
</style>
</head>
<body>
<div id="wall" aria-label="Camera wall"></div>
<div id="bar">
  <b id="title">camwall</b><span id="summary"></span>
  <span class="sp"></span>
  <button id="names" title="Show or hide names (N)">Names</button>
  <button id="reset" title="Make every feed its normal size">Reset sizes</button>
  <button id="kiosk" title="Hide this bar (K); press K or Esc to bring it back">Hide bar</button>
  <button id="full" title="Full screen (F)">Full screen</button>
</div>
<div id="err"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const wall = $('wall');
const HERO = 6;            // weight given to a pinned feed: asks for six times the area
let feeds = [], base = [], weights = [], tiles = [], focused = -1;

const params = new URLSearchParams(location.search);
if (params.has('kiosk')) document.body.classList.add('kiosk');
if (params.has('nonames')) document.body.classList.add('nonames');
const setBar = () => document.documentElement.style.setProperty('--bar',
  document.body.classList.contains('kiosk') ? '0px' : '40px');

function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.append(e); return e; }

async function init() {
  const r = await fetch('api/feeds');
  if (!r.ok) throw new Error(await r.text());
  const info = await r.json();
  feeds = info.feeds;
  document.title = info.title;
  $('title').textContent = info.title;
  base = feeds.map(f => f.weight);
  weights = base.slice();
  for (const f of feeds) {
    const t = el('div', 'tile ' + (f.static ? 'live' : 'starting'), wall);
    const inn = el('div', 'in', t);
    const img = el('img', null, inn);
    img.alt = f.name; img.decoding = 'async';
    if (f.static) img.src = 'media/' + f.id;
    const name = el('div', 'name', inn);
    el('span', 'dot', name);
    el('span', null, name).textContent = f.name;
    const msg = el('div', 'msg', inn);
    msg.textContent = 'Connecting…';
    const pin = el('button', 'pin', inn);
    pin.textContent = '★'; pin.title = 'Make this feed bigger';
    pin.setAttribute('aria-label', 'Make ' + f.name + ' bigger');
    pin.onclick = (e) => { e.stopPropagation(); togglePin(f.id); };
    inn.onclick = () => setFocus(focused === f.id ? -1 : f.id);
    tiles.push({ t, img, msg, pin, url: null, busy: false, pending: null, last: 0 });
    if (f.note) console.warn(f.name + ': ' + f.note);
  }
  setBar();
  await relayout();
  stream();
  pollStatus();
}

let seq = 0;
async function relayout() {
  const my = ++seq;
  const w = wall.clientWidth, h = wall.clientHeight;
  if (!w || !h) return;
  const r = await fetch(`api/layout?aspect=${(w / h).toFixed(4)}&weights=${weights.join(',')}`);
  if (my !== seq) return;           // a newer request is on its way
  if (!r.ok) { showError(await r.text()); return; }
  const L = await r.json();
  for (const tl of L.tiles) {
    const s = tiles[tl.feed].t.style;
    s.left = (tl.x * 100) + '%'; s.top = (tl.y * 100) + '%';
    s.width = (tl.w * 100) + '%'; s.height = (tl.h * 100) + '%';
  }
  const pinned = weights.filter((x, i) => x !== base[i]).length;
  $('summary').textContent = `${feeds.length} feed${feeds.length === 1 ? '' : 's'}` +
    (pinned ? ` · ${pinned} pinned` : '') + ` · best of ${fmt(L.shapes)} layouts`;
}

function fmt(n) {
  if (n < 1e6) return Math.round(n).toLocaleString();
  const e = Math.floor(Math.log10(n));
  return (n / 10 ** e).toFixed(1) + '×10' + String(e).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
}

function togglePin(id) {
  weights[id] = weights[id] === base[id] ? Math.max(HERO, base[id] * HERO) : base[id];
  tiles[id].pin.classList.toggle('on', weights[id] !== base[id]);
  relayout();
}

function setFocus(id) {
  if (focused >= 0) tiles[focused].t.classList.remove('focused');
  focused = id;
  document.body.classList.toggle('focus', id >= 0);
  if (id >= 0) tiles[id].t.classList.add('focused');
}

// One response carries every moving feed: [id u16][length u32][JPEG]…
async function stream() {
  const ids = feeds.filter(f => !f.static).map(f => f.id);
  if (!ids.length) return;
  for (;;) {
    try {
      const r = await fetch('stream?ids=' + ids.join(','), { cache: 'no-store' });
      if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const nb = new Uint8Array(buf.length + value.length);
        nb.set(buf); nb.set(value, buf.length); buf = nb;
        let off = 0;
        while (buf.length - off >= 6) {
          const dv = new DataView(buf.buffer, buf.byteOffset + off, 6);
          const id = dv.getUint16(0), len = dv.getUint32(2);
          if (buf.length - off - 6 < len) break;
          if (id !== 0xFFFF && tiles[id]) show(id, buf.slice(off + 6, off + 6 + len));
          off += 6 + len;
        }
        buf = buf.slice(off);
      }
    } catch (e) { console.warn('stream:', e.message); }
    await new Promise(res => setTimeout(res, 2000));
  }
}

// Show a frame; if the tile is still decoding the last one, keep only the newest.
function show(id, bytes) {
  const T = tiles[id];
  T.last = performance.now();
  if (T.busy) { T.pending = bytes; return; }
  T.busy = true;
  const url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
  const done = () => {
    if (T.url) URL.revokeObjectURL(T.url);
    T.url = url; T.busy = false;
    if (T.pending) { const p = T.pending; T.pending = null; show(id, p); }
  };
  T.img.onload = done; T.img.onerror = done;
  T.img.src = url;
}

async function pollStatus() {
  for (;;) {
    try {
      const st = await (await fetch('api/status', { cache: 'no-store' })).json();
      const now = performance.now();
      st.forEach((s, i) => {
        if (feeds[i].static) return;
        const T = tiles[i];
        let state = s.state;
        if (state === 'live' && T.last && now - T.last > 5000) state = 'stale';
        if (state === 'idle') state = 'starting';
        T.t.classList.remove('live', 'starting', 'retrying', 'stale');
        T.t.classList.add(state);
        T.msg.textContent = state === 'retrying' ? 'Feed lost. Reconnecting…'
          : state === 'stale' ? 'No new picture for a while…' : 'Connecting…';
      });
    } catch (e) { /* server restarting; keep trying */ }
    await new Promise(res => setTimeout(res, 2000));
  }
}

function showError(text) { const e = $('err'); e.textContent = text; e.style.display = 'grid'; }

let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 120); });
$('names').onclick = () => document.body.classList.toggle('nonames');
$('reset').onclick = () => { weights = base.slice(); tiles.forEach(T => T.pin.classList.remove('on')); relayout(); };
$('kiosk').onclick = () => { document.body.classList.add('kiosk'); setBar(); relayout(); };
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') {
    if (focused >= 0) setFocus(-1);
    else if (document.body.classList.contains('kiosk')) { document.body.classList.remove('kiosk'); setBar(); relayout(); }
  } else if (k === 'k') { document.body.classList.toggle('kiosk'); setBar(); relayout(); }
  else if (k === 'n') document.body.classList.toggle('nonames');
  else if (k === 'f') $('full').click();
});
init().catch(e => showError('Could not load the wall: ' + e.message));
</script>
</body>
</html>
